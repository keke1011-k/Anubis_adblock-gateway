<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ANUBIS Partner</title>
  <style>
    * { box-sizing:border-box; }
    html,body { width:100%; height:100%; margin:0; overflow:hidden; }
    body { color:#fff; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif; }
    a { height:100%; display:flex; position:relative; padding:clamp(14px,3vw,28px); color:inherit; text-decoration:none; overflow:hidden; background:linear-gradient(125deg,#102e5c 0%,#1d78b7 58%,#55c8cb 100%); }
    a:before { content:""; position:absolute; width:60vmax; height:60vmax; right:-30vmax; top:-45vmax; border:1px solid rgba(255,255,255,.23); border-radius:50%; box-shadow:0 0 0 24px rgba(255,255,255,.06),0 0 0 58px rgba(255,255,255,.045); }
    .copy { position:relative; z-index:1; max-width:68%; display:flex; flex-direction:column; justify-content:center; }.sponsor { margin-bottom:5px; font-size:10px; letter-spacing:.12em; font-weight:700; opacity:.85; }.title { font-size:clamp(16px,4vw,30px); font-weight:900; line-height:1.28; letter-spacing:.025em; }.text { margin-top:7px; font-size:clamp(10px,2vw,14px); opacity:.92; }.cta { display:inline-block; width:max-content; margin-top:12px; padding:6px 12px; border-radius:99px; color:#0a4771; background:#fff; font-size:12px; font-weight:800; }.orb { position:absolute; right:clamp(-5px,5vw,46px); bottom:50%; transform:translateY(50%); width:clamp(94px,28vw,210px); aspect-ratio:1; border-radius:50%; background:radial-gradient(circle at 33% 28%,#fef5bd 0 8%,#f4b247 9% 30%,#e36d53 31% 52%,#714d9b 53% 70%,#173565 71%); box-shadow:inset -17px -14px 25px rgba(0,0,0,.22),0 18px 24px rgba(2,22,66,.35); }.orbit { position:absolute; right:0; bottom:50%; transform:translateY(50%) rotate(-20deg); width:clamp(150px,42vw,310px); height:clamp(50px,12vw,90px); border:3px solid rgba(255,255,255,.8); border-radius:50%; }.ad { position:absolute; right:9px; bottom:6px; font-size:9px; letter-spacing:.06em; opacity:.63; }
    @media (max-height:135px) { .text,.cta { display:none; }.copy { max-width:72%; }.sponsor { margin-bottom:2px; } }
  </style>
</head>
<body>
  <a href="#" aria-label="ANUBIS Partner の詳細（デモ）" onclick="return false">
    <div class="copy"><div class="sponsor">ANUBIS PARTNER</div><div class="title">発見は、<br>すぐそばにある。</div><div class="text">毎日に小さなヒントを届ける、暮らしの特集。</div><span class="cta">特集を読む　→</span></div>
    <div class="orbit"></div><div class="orb" aria-hidden="true"></div><span class="ad">AD</span>
  </a>
</body>
</html>
