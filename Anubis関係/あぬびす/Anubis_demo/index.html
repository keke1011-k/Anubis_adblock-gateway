
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anubis 広告ブロック体験</title>

    <style>
        body {
            margin: 0;
            font-family: sans-serif;
            background: #f2f2f2;
            color: #222;
        }

        header {
            background: #222;
            color: white;
            padding: 25px;
            text-align: center;
        }

        main {
            max-width: 900px;
            margin: 30px auto;
            background: white;
            padding: 30px;
        }

        .ad {
            margin: 25px 0;
            padding: 10px;
            text-align: center;
            min-height: 220px;
        }

        article {
            line-height: 2;
        }

        #ad-frame {
            width: 100%;
            height: 220px;
            border: 0;
        }

        #ad-status {
            color: #16803c;
            font-weight: bold;
            padding: 70px 0;
            display: none;
        }
    </style>
</head>

<body>

<header>
    <h1>Anubis 広告ブロック体験</h1>
    <p>ネットワーク型広告ブロックのデモ</p>
</header>

<main>
    <h2>ニュース記事</h2>

    <article>
        <p>これはCEATEC展示用のデモサイトです。</p>

        <p>
            Webサイトでは、ページ本体とは別に
            広告やトラッカーなどの通信が発生することがあります。
        </p>

        <p>
            AnubisはDNS通信を利用して、
            不要な広告やトラッカー通信をブロックします。
        </p>
    </article>

    <div class="ad">
        <iframe id="ad-frame" title="広告"></iframe>
        <div id="ad-status">Anubisが広告をブロック中</div>
    </div>
</main>

<script>
    const adFrame = document.getElementById("ad-frame");
    const adStatus = document.getElementById("ad-status");

    let lastMode = null;

    async function updateAd() {
        try {
            const response = await fetch(
                "http://192.168.100.21:5000/status",
                { cache: "no-store" }
            );

            if (!response.ok) {
                throw new Error("状態取得失敗");
            }

            const data = await response.json();
            const mode = data.mode;

            if (mode !== "on" && mode !== "off") return;
            if (mode === lastMode) return;

            lastMode = mode;

            if (mode === "on") {
                adFrame.removeAttribute("src");
                adFrame.style.display = "none";
                adStatus.style.display = "block";
            } else {
                adStatus.style.display = "none";
                adFrame.style.display = "block";

                adFrame.src =
                    "http://ad.anubis.test:8081/ad.html?t=" +
                    Date.now();
            }

        } catch (error) {
            console.error("Anubis通信エラー:", error);
        }
    }

    updateAd();
    setInterval(updateAd, 1000);
</script>

</body>
</html>
